[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterpriseplan-ai"
version = "0.1.0"
description = "本地化企业项目策划与计划编制多智能体平台"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.3",
    "pgvector==0.5.0",
    "langgraph==1.2.9",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain-core==1.5.0",
    "langchain-openai==1.4.0",
    "httpx==0.28.1",
    "pymupdf==1.28.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "streamlit==1.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]
local-models = [
    "sentence-transformers==4.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
